name: Build & Deploy Hotels to DigitalOcean

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build backend
        run: |
          COMMIT_HASH=$(echo "$GITHUB_SHA" | cut -c1-7)

          docker build \
            -f Dockerfile.backend \
            -t michedot/hotels-backend:latest \
            -t michedot/hotels-backend:$COMMIT_HASH \
            .

      - name: Build platform
        run: |
          COMMIT_HASH=$(echo "$GITHUB_SHA" | cut -c1-7)

          docker build \
            -f Dockerfile.platform \
            -t michedot/hotels-platform:latest \
            -t michedot/hotels-platform:$COMMIT_HASH \
            .

      - name: Build tenant
        run: |
          COMMIT_HASH=$(echo "$GITHUB_SHA" | cut -c1-7)

          docker build \
            -f Dockerfile.tenant \
            -t michedot/hotels-tenant:latest \
            -t michedot/hotels-tenant:$COMMIT_HASH \
            .

      - name: Push Docker images
        run: |
          COMMIT_HASH=$(echo "$GITHUB_SHA" | cut -c1-7)

          docker push michedot/hotels-backend:latest
          docker push michedot/hotels-backend:$COMMIT_HASH

          docker push michedot/hotels-platform:latest
          docker push michedot/hotels-platform:$COMMIT_HASH

          docker push michedot/hotels-tenant:latest
          docker push michedot/hotels-tenant:$COMMIT_HASH

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.DROPLET_SSH_KEY_B64 }}" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Deploy to droplet
        run: |
          ssh \
            -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -T \
            ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }} << 'EOF'
            set -e

            cd "${{ secrets.DEPLOY_PATH }}"

            docker compose pull backend platform tenant
            docker compose up -d
          EOF
